<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151b" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>Générateur de liens SMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/qrcode-generator-2.0.4.js"></script>
<style>
  :root {
    --bg: #f5f7f9;
    --surface: #ffffff;
    --board: #e4eaf0;
    --ink: #15202b;
    --ink-2: #4c5864;
    --ink-3: #75808c;
    --line: #d2d9e0;
    --line-strong: #aeb9c4;
    --accent: #2b50e8;
    --accent-hover: #2142cc;
    --accent-ink: #ffffff;
    --accent-soft: #e2e8ff;
    --warn: #8a5300;
    --warn-line: #e0a23a;
    --warn-soft: #fff3dc;
    --error: #b42318;
    --error-line: #e5675c;
    --error-soft: #fde8e6;
    --slot: #edf1f5;
    --tick: rgba(21, 32, 43, 0.12);
    --bezel: #1e2329;
    --screen: #ffffff;
    --screen-ink: #111418;
    --screen-muted: #8a8f96;
    --screen-line: #e3e5e8;
    --send: #2b6ef5;
    --font-ui: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151b;
      --surface: #16202a;
      --board: #1a2530;
      --ink: #e6ecf2;
      --ink-2: #a8b3be;
      --ink-3: #7f8b97;
      --line: #2a3744;
      --line-strong: #435363;
      --accent: #7b96ff;
      --accent-hover: #9aaeff;
      --accent-ink: #0f151b;
      --accent-soft: #24305a;
      --warn: #f2bd62;
      --warn-line: #b57d1f;
      --warn-soft: #33270f;
      --error: #ff958b;
      --error-line: #c4473c;
      --error-soft: #3a1b19;
      --slot: #223040;
      --tick: rgba(230, 236, 242, 0.12);
      --bezel: #050608;
      --screen: #000000;
      --screen-ink: #f2f3f5;
      --screen-muted: #8d929a;
      --screen-line: #2a2c30;
      --send: #3b82f6;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  /* chiffres tabulaires uniquement sur le compteur (pas de ponctuation : la police élargit , et . en mode tabulaire) */
  #countText { font-variant-numeric: tabular-nums; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Structure ---------- */
  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  @media (min-width: 720px) { .page { padding-left: 32px; padding-right: 32px; padding-top: 44px; } }

  .masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
  h1 { font-size: clamp(26px, 4.2vw, 34px); line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; }
  .lede { margin-top: 8px; max-width: 58ch; color: var(--ink-2); font-size: 16px; }

  .lang { display: inline-flex; flex-shrink: 0; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); }
  .lang button { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--ink-3); min-height: 32px; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (min-width: 1040px) {
    .layout { grid-template-columns: minmax(340px, 400px) minmax(0, 1fr); gap: 40px; }
    .compose { padding-top: 28px; }
  }

  h2 { display: flex; align-items: baseline; gap: 10px; font-size: 18px; line-height: 1.3; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 18px; }
  .step { color: var(--accent); font-weight: 700; min-width: 0.7em; }

  /* ---------- Champs ---------- */
  .field + .field { margin-top: 22px; }
  .field-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  label, .label { display: block; font-size: 14px; font-weight: 600; }
  .field > label, .field > .label { margin-bottom: 8px; }
  .field-head label { margin: 0; }
  .tag { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; }

  input, textarea {
    display: block; width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 16px; line-height: 1.45;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }
  input:hover, textarea:hover { border-color: var(--line-strong); }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[aria-invalid="true"] { border-color: var(--error); }
  input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px var(--error-soft); }
  #phone { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
  #phone::placeholder { font-weight: 400; }
  textarea { resize: vertical; min-height: 132px; }

  .note { margin-top: 7px; font-size: 13px; line-height: 1.45; color: var(--ink-3); }
  .note.is-error { color: var(--error); font-weight: 500; }

  /* ---------- Compteur SMS : une case par SMS facturé ---------- */
  .meter { display: flex; gap: 5px; margin-top: 12px; height: 10px; }
  .slot {
    --cap: 160;
    position: relative; flex: 1; min-width: 0; overflow: hidden;
    border-radius: 3px;
    background-color: var(--slot);
  }
  .slot::after {
    /* graduation tous les 10 caractères */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(100% * 10 / var(--cap) - 1px), var(--tick) calc(100% * 10 / var(--cap) - 1px), var(--tick) calc(100% * 10 / var(--cap)));
  }
  .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width 0.18s ease-out; }
  .slot.is-extra .fill { background: var(--error-line); }
  .slot.is-extra { background-color: var(--error-soft); }
  .readout { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  .readout .segs { font-weight: 600; color: var(--ink); text-align: right; }
  .readout .segs.is-extra { color: var(--error); }

  /* ---------- Alertes ---------- */
  .alerts:empty { display: none; }
  .alerts { display: grid; gap: 8px; margin-top: 12px; }
  .alert { border-left: 3px solid; border-radius: 4px 8px 8px 4px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; }
  .alert.warn { border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn); }
  .alert.error { border-color: var(--error-line); background: var(--error-soft); color: var(--error); }
  .alert p + p, .alert p + .chips, .alert .chips + button { margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; min-height: 24px; padding: 1px 8px; border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; border: 1px solid var(--line); }
  .alert button {
    display: inline-block; border: 1px solid currentColor; background: transparent;
    border-radius: 8px; padding: 6px 12px; min-height: 36px;
    font-size: 13px; font-weight: 600; color: inherit;
  }
  .alert button:hover { background: var(--surface); }

  /* ---------- Lien ---------- */
  .link-box { display: flex; align-items: stretch; gap: 8px; }
  .link-out {
    flex: 1; min-width: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px;
    font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55;
    word-break: break-all; color: var(--ink);
  }
  .link-out.is-empty { font-family: var(--font-ui); font-size: 13.5px; color: var(--ink-3); word-break: normal; }

  /* ---------- Boutons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 16px; border-radius: 10px;
    font-size: 14.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
    border: 1px solid transparent; touch-action: manipulation;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn svg { width: 17px; height: 17px; flex-shrink: 0; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover { border-color: var(--line-strong); }
  .btn-copy { background: var(--surface); color: var(--accent); border-color: var(--line); min-width: 92px; }
  .btn-copy:hover { border-color: var(--line-strong); }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }

  /* ---------- Plateau de vérification / export ---------- */
  .board {
    background: var(--board);
    border-radius: 22px;
    padding: 24px 20px 28px;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px;
  }
  @media (min-width: 760px) {
    .board { grid-template-columns: 280px minmax(0, 1fr); gap: 36px; padding: 28px 32px 32px; }
  }
  .verify { display: flex; flex-direction: column; align-items: flex-start; }
  .verify .btn { margin-top: 18px; width: min(280px, 100%); }
  .verify .note { max-width: 280px; }

  /* Téléphone : maquette fidèle, la seule ombre portée de la page */
  .device {
    width: min(280px, 100%); aspect-ratio: 280 / 560; max-height: 560px;
    padding: 10px; border-radius: 46px;
    background: var(--bezel);
    box-shadow: 0 1px 0 1px rgba(255, 255, 255, 0.06) inset, 0 24px 48px -18px rgba(15, 25, 40, 0.45), 0 8px 16px -8px rgba(15, 25, 40, 0.3);
  }
  .screen {
    position: relative; height: 100%; overflow: hidden;
    border-radius: 37px; background: var(--screen); color: var(--screen-ink);
    font-family: var(--font-phone);
    display: flex; flex-direction: column;
  }
  .island { position: absolute; top: 9px; left: 50%; width: 82px; height: 24px; margin-left: -41px; border-radius: 14px; background: #000; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 12px 22px 0 28px; height: 40px; font-size: 13px; font-weight: 600; }
  .status svg { height: 11px; width: auto; display: block; }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .convo-head { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px 10px; border-bottom: 1px solid var(--screen-line); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(#a5abb4, #868c95); display: grid; place-items: center; }
  .avatar svg { width: 24px; height: 24px; }
  .convo-name { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo-name.is-empty { color: var(--screen-muted); font-weight: 500; }
  .convo-body { flex: 1; display: flex; justify-content: center; padding-top: 14px; min-height: 40px; }
  .convo-service { font-size: 11px; color: var(--screen-muted); }
  .composer { display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px 22px; }
  .composer-field {
    flex: 1; min-width: 0; max-height: 300px; overflow-y: auto;
    border: 1px solid var(--screen-line); border-radius: 18px;
    padding: 7px 12px; font-size: 14px; line-height: 1.35;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .composer-field.is-empty { color: var(--screen-muted); }
  .send { width: 28px; height: 28px; border-radius: 50%; background: var(--send); display: grid; place-items: center; flex-shrink: 0; margin-bottom: 3px; }
  .send svg { width: 14px; height: 14px; }
  .device { container-type: inline-size; }
  @container (max-width: 270px) {
    .status { padding: 12px 14px 0 22px; }
    .status-icons svg:nth-child(2) { display: none; }
  }
  .home-bar { position: absolute; bottom: 7px; left: 50%; width: 96px; height: 4px; margin-left: -48px; border-radius: 2px; background: var(--screen-ink); opacity: 0.85; }

  /* ---------- Export du QR ---------- */
  .segmented { display: flex; gap: 3px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
  .segment { flex: 1; position: relative; margin: 0; font-weight: 600; cursor: pointer; }
  .segment input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: pointer; border: 0; }
  .segment span { display: flex; align-items: center; justify-content: center; min-height: 38px; padding: 4px 10px; border-radius: 8px; font-size: 14px; color: var(--ink-2); text-align: center; transition: background-color 0.15s, color 0.15s; }
  .segment input:checked + span { background: var(--ink); color: var(--bg); }
  .segment input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .format-help { list-style: none; margin-top: 12px; display: grid; gap: 7px; font-size: 13px; line-height: 1.45; color: var(--ink-3); }
  .format-help li { padding-left: 11px; border-left: 2px solid transparent; }
  .format-help li.is-active { color: var(--ink); border-left-color: var(--accent); }
  .format-help strong { font-weight: 600; }

  .qr-area { margin-top: 22px; display: grid; gap: 16px; width: 232px; max-width: 100%; }
  .qr-frame { width: 232px; max-width: 100%; }
  .qr-canvas { background: #fff; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; line-height: 0; }
  .qr-canvas svg { display: block; width: 100%; height: auto; }
  .qr-frame figcaption { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
  .qr-empty {
    width: 232px; max-width: 100%; aspect-ratio: 1; border-radius: 14px;
    border: 1.5px dashed var(--line-strong);
    display: grid; place-items: center; padding: 24px; text-align: center;
    font-size: 13.5px; color: var(--ink-3);
  }
  .downloads { display: grid; gap: 10px; align-content: start; }
  .downloads .btn { width: 100%; }

  .foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="lede" data-i18n="lede"></p>
    </div>
    <div class="lang" role="group" data-i18n-aria="langLabel">
      <button type="button" data-lang="fr" lang="fr">FR</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <main class="layout">
    <!-- 1. Saisie -->
    <section class="compose" aria-labelledby="step1">
      <h2 id="step1"><span class="step">1</span><span data-i18n="step1"></span></h2>

      <div class="field">
        <div class="field-head">
          <label for="phone" data-i18n="phoneLabel"></label>
          <span class="tag" id="phoneTag" hidden></span>
        </div>
        <input id="phone" type="tel" inputmode="tel" autocomplete="off" spellcheck="false" aria-describedby="phoneNote">
        <p class="note" id="phoneNote"></p>
      </div>

      <div class="field">
        <label for="message" data-i18n="messageLabel"></label>
        <textarea id="message" rows="5" aria-describedby="smsReadout"></textarea>
        <div class="meter" id="meter" aria-hidden="true"></div>
        <div class="readout" id="smsReadout">
          <span id="countText"></span>
          <span class="segs" id="segText"></span>
        </div>
        <div class="alerts" id="smsAlerts" aria-live="polite"></div>
      </div>

      <div class="field">
        <span class="label" id="linkLabel" data-i18n="linkLabel"></span>
        <div class="link-box">
          <output class="link-out" id="linkOut" aria-labelledby="linkLabel"></output>
          <button type="button" class="btn btn-copy" id="copyBtn"></button>
        </div>
      </div>
    </section>

    <div class="board">
      <!-- 2. Vérification -->
      <section class="verify" aria-labelledby="step2">
        <h2 id="step2"><span class="step">2</span><span data-i18n="step2"></span></h2>
        <div class="device" role="img" id="device">
          <div class="screen">
            <div class="island"></div>
            <div class="status">
              <span>9:41</span>
              <span class="status-icons">
                <svg viewBox="0 0 17 11" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
                <svg viewBox="0 0 15 11" fill="currentColor" aria-hidden="true"><path d="M7.5 2.2c2.1 0 4 .8 5.4 2.1l1.1-1.1A9.2 9.2 0 0 0 7.5.6 9.2 9.2 0 0 0 1 3.2l1.1 1.1a7.7 7.7 0 0 1 5.4-2.1Zm0 3.2c1.2 0 2.4.5 3.2 1.3l1.1-1.1a6.1 6.1 0 0 0-8.6 0l1.1 1.1c.8-.8 2-1.3 3.2-1.3Zm0 3.2c-.4 0-.8.2-1.1.5L7.5 10.2l1.1-1.1a1.6 1.6 0 0 0-1.1-.5Z"/></svg>
                <svg viewBox="0 0 26 12" aria-hidden="true"><rect x="0.5" y="0.5" width="22" height="11" rx="3.2" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.6" height="4" rx="0.8" fill="currentColor" opacity="0.4"/></svg>
              </span>
            </div>
            <div class="convo-head">
              <span class="avatar"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="12" cy="8.5" r="4.2"/><path d="M3.8 21c.7-4.3 4.1-6.7 8.2-6.7s7.5 2.4 8.2 6.7Z"/></svg></span>
              <span class="convo-name" id="pvNumber"></span>
            </div>
            <div class="convo-body"><span class="convo-service">SMS</span></div>
            <div class="composer">
              <div class="composer-field" id="pvText"></div>
              <span class="send"><svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V2.5M2.8 6.5 7 2.3l4.2 4.2"/></svg></span>
            </div>
            <div class="home-bar"></div>
          </div>
        </div>
        <a class="btn btn-secondary" id="openBtn">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h14v9H8.5L5 16.5v-3H3Z"/></svg>
          <span data-i18n="open"></span>
        </a>
        <p class="note" data-i18n="openHelp"></p>
      </section>

      <!-- 3. Export -->
      <section aria-labelledby="step3">
        <h2 id="step3"><span class="step">3</span><span data-i18n="step3"></span></h2>
        <span class="label" id="formatLabel" data-i18n="formatLabel" style="margin-bottom: 8px;"></span>
        <div class="segmented" role="radiogroup" aria-labelledby="formatLabel">
          <label class="segment"><input type="radio" name="qrFormat" value="sms"><span data-i18n="fmtSms"></span></label>
          <label class="segment"><input type="radio" name="qrFormat" value="smsto"><span data-i18n="fmtSmsto"></span></label>
        </div>
        <ul class="format-help" id="formatHelp">
          <li data-format="sms"><strong data-i18n="fmtSms"></strong>. <span data-i18n="fmtSmsHelp"></span></li>
          <li data-format="smsto"><strong data-i18n="fmtSmsto"></strong>. <span data-i18n="fmtSmstoHelp"></span></li>
        </ul>
        <div class="alerts" id="qrAlerts" aria-live="polite"></div>

        <div class="qr-area">
          <div>
            <figure class="qr-frame" id="qrFrame" hidden>
              <div class="qr-canvas" id="qr" role="img"></div>
              <figcaption id="qrMeta"></figcaption>
            </figure>
            <p class="qr-empty" id="qrEmpty"></p>
          </div>
          <div class="downloads">
            <button type="button" class="btn btn-primary" id="pngBtn">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M4 16.5h12"/></svg>
              <span data-i18n="dlPng"></span>

            <button type="button" class="btn btn-secondary" id="svgBtn">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M4 16.5h12"/></svg>
              <span data-i18n="dlSvg"></span>

      </section>
    </div>
  </main>

  <footer class="foot"><p id="version"></p></footer>
</div>

<script>
(function () {
  'use strict';

  // Version affichée en bas de la page : à mettre à jour à chaque publication.
  const APP_VERSION = '2.0';
  const APP_UPDATED = '2026-10-21';
  const LANG_KEY = 'sms-tool-lang';
  const FORMAT_KEY = 'sms-tool-qr-format';

  const I18N = {
    fr: {
      locale: 'fr-FR',

      qrDense: 'QR dense : un message plus court se scanne plus facilement de loin.',
      dlPng: 'Télécharger en PNG',
      dlSvg: 'Télécharger en SVG',
      dlNote: (px) => 'PNG de ' + px + ' × ' + px + ' px. SVG vectoriel, adapté à l’impression.',
      version: (v, d) => 'Version ' + v + ', mise à jour le ' + d
    },
    en: {
      locale: 'en-US',
      docTitle: 'SMS Link Generator',
      title: 'SMS link generator',
      lede: 'Create the link and QR code for an SMS campaign, then check the message before it goes out.',
      langLabel: 'Language',
      step1: 'Write the SMS',
      phoneLabel: 'Number',
      phonePh: '72525',
      phoneHelp: 'Short code (e.g. 72525) or mobile number.',
      phoneShort: 'Short code',
      phoneLong: 'Long number',
      phoneErrChars: 'Only digits, spaces and a leading “+” are allowed.',
      phoneErrLength: 'The number must have between 3 and 15 digits.',
      messageLabel: 'Message',
      messagePh: 'KEYWORD\nSend this SMS without changing it (0.99E/SMS + SMS price).',
      count: (n, limit) => n + ' character' + (n === 1 ? '' : 's') + ' of ' + limit,
      segs: (n, enc) => n + ' SMS, ' + (enc === 'gsm' ? 'GSM alphabet' : 'Unicode'),
      alertMulti: (n, per) => 'The message is sent as ' + n + ' SMS: on a premium-rate number, each SMS may be billed. In a multi-part send, each SMS holds at most ' + per + ' characters.',
      alertUcs2: 'These characters are not in the GSM alphabet. They switch the SMS to Unicode, limited to 70 characters:',
      alertUcs2Left: 'These characters have no GSM equivalent and must be removed by hand:',
      fixBtn: 'Replace with compatible characters',
      alertExt: 'These characters count as 2 each:',
      charNames: { ' ': 'non-breaking space', ' ': 'narrow non-breaking space', ' ': 'thin space', ' ': 'space', ' ': 'space', ' ': 'space', '​': 'zero-width space', '\t': 'tab', '\f': 'form feed' },
      linkLabel: 'Campaign link',
      linkEmpty: 'The link appears once a valid number is entered.',
      copy: 'Copy',
      copied: 'Copied',
      copyFail: 'Failed',
      step2: 'Check the message',
      deviceLabel: 'Preview of the pre-filled SMS in the Messages app',
      pvNumberEmpty: 'Number',
      pvTextEmpty: 'Message',
      open: 'Open in Messages',
      openHelp: 'Opens this device’s Messages app with the pre-filled SMS, without sending it.',
      step3: 'Export the QR code',
      formatLabel: 'QR code format',
      fmtSms: 'SMS link',
      fmtSmsto: 'SMSTO text',
      fmtSmsHelp: 'Standard format, recommended by default. The QR code contains the campaign link.',
      fmtSmstoHelp: 'Plain-text message, no encoding. Use it if some Android phones display the message incorrectly (missing “+”, visible “%20”). QR code only.',
      smstoAccent: 'The message contains accents or special characters: with SMSTO, some scanners may display them incorrectly. Prefer a message without accents, or the SMS link format.',
      qrEmpty: 'The QR code appears once a valid number is entered.',
      qrError: 'The QR code could not be generated: the message is too long.',
      qrAlt: 'Campaign QR code',
      qrModules: (n) => n + ' × ' + n + ' modules',
      qrDense: 'Dense QR code: a shorter message is easier to scan from a distance.',
      dlPng: 'Download PNG',
      dlSvg: 'Download SVG',
      dlNote: (px) => 'PNG at ' + px + ' × ' + px + ' px. Vector SVG, suited for print.',
      version: (v, d) => 'Version ' + v + ', updated ' + d
    }
  };

  // ---------- Stockage local (préférences de l'utilisateur uniquement) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // ---------- Alphabet GSM 03.38 ----------
  // Un SMS en alphabet GSM tient en 160 caractères (153 par SMS en envoi multiple).
  // Un seul caractère hors alphabet fait passer tout le SMS en Unicode : 70 (67).
  const GSM_BASIC = new Set(Array.from('@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà'));
  const GSM_EXT = new Set(Array.from('^{}\\[~]|€\f')); // comptent pour 2

  function analyzeSms(text) {
    const chars = Array.from(text);
    const nonGsm = [];
    const ext = [];
    for (const c of chars) {
      if (GSM_BASIC.has(c)) continue;
      if (GSM_EXT.has(c)) { if (!ext.includes(c)) ext.push(c); continue; }
      if (!nonGsm.includes(c)) nonGsm.push(c);
    }
    if (nonGsm.length === 0) {
      let units = 0;
      for (const c of chars) units += GSM_EXT.has(c) ? 2 : 1;
      return { encoding: 'gsm', units, limit: 160, per: 153, segments: units === 0 ? 0 : (units <= 160 ? 1 : Math.ceil(units / 153)), nonGsm, ext };
    }
    const units = text.length; // unités UTF-16 : un emoji compte pour 2
    return { encoding: 'ucs2', units, limit: 70, per: 67, segments: units <= 70 ? 1 : Math.ceil(units / 67), nonGsm, ext: [] };
  }

  // Remplacements vers l'alphabet GSM (déclenchés uniquement par le bouton)
  const GSM_REPLACEMENTS = {
    '’': "'", '‘': "'", '‚': "'", '′': "'", '´': "'", '`': "'",
    '“': '"', '”': '"', '„': '"', '«': '"', '»': '"', '″': '"',
    '–': '-', '—': '-', '‐': '-', '‑': '-', '−': '-',
    '…': '...', '•': '-', '·': '.',
    ' ': ' ', ' ': ' ', ' ': ' ', ' ': ' ', ' ': ' ', ' ': ' ', '​': '', '\t': ' ',
    'œ': 'oe', 'Œ': 'OE', 'ç': 'c'
  };
  function toGsm(text) {
    // « texte » -> "texte" : les espaces collées aux guillemets français disparaissent
    text = text.replace(/«[   ]*/g, '"').replace(/[   ]*»/g, '"');
    return Array.from(text).map((c) => {
      if (GSM_BASIC.has(c) || GSM_EXT.has(c)) return c;
      if (Object.prototype.hasOwnProperty.call(GSM_REPLACEMENTS, c)) return GSM_REPLACEMENTS[c];
      const base = c.normalize('NFD').replace(/[̀-ͯ]/g, '');
      return (base && Array.from(base).every((b) => GSM_BASIC.has(b))) ? base : c;
    }).join('');
  }

  // ---------- Numéro ----------
  function analyzePhone(raw) {
    const value = raw.trim();
    if (!value) return { state: 'empty' };
    const clean = value.replace(/[\s().-]/g, '');
    if (!/^\+?\d+$/.test(clean)) return { state: 'invalid', reason: 'chars' };
    const digits = clean.replace('+', '');
    if (digits.length < 3 || digits.length > 15) return { state: 'invalid', reason: 'length' };
    return { state: 'ok', clean, kind: (!clean.startsWith('+') && digits.length <= 6) ? 'short' : 'long' };
  }

  // ---------- Lien et contenu du QR ----------
  // , / : restent en clair (autorisés dans un lien) pour limiter ce qu'un scanner
  // Android qui décode mal peut altérer.
  function encodeSmsBody(text) {
    return encodeURIComponent(text).replace(/%2C|%2F|%3A/gi, decodeURIComponent);
  }
  function buildLink(phone, text) {
    return 'sms:' + phone + (text ? '?body=' + encodeSmsBody(text) : '');
  }
  // SMSTO:numéro:message, message en texte brut : le scanner n'a rien à décoder.
  // Format propre aux QR codes, pas utilisable comme lien cliquable.
  function buildQrContent(format, phone, text, link) {
    if (format === 'smsto') return 'SMSTO:' + phone + (text ? ':' + text : '');
    return link;
  }

  // ---------- QR (qrcode-generator, UTF-8 sans BOM) ----------
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  const QUIET = 4; // marge blanche réglementaire : 4 modules

  function makeQr(content) {
    const qr = qrcode(0, 'M');
    qr.addData(content, 'Byte');
    qr.make();
    return qr;
  }
  function qrSvg(qr) {
    const n = qr.getModuleCount();
    const size = n + QUIET * 2;
    let d = '';
    for (let r = 0; r < n; r++) {
      let c = 0;
      while (c < n) {
        if (!qr.isDark(r, c)) { c++; continue; }
        let run = 1;
        while (c + run < n && qr.isDark(r, c + run)) run++;
        d += 'M' + (c + QUIET) + ' ' + (r + QUIET) + 'h' + run + 'v1h-' + run + 'z';
        c += run;
      }
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="' + (size * 8) + '" height="' + (size * 8) + '" shape-rendering="crispEdges">' +
      '<rect width="' + size + '" height="' + size + '" fill="#ffffff"/><path fill="#000000" d="' + d + '"/></svg>';
  }
  function pngScale(qr) {
    const size = qr.getModuleCount() + QUIET * 2;
    return Math.ceil(1024 / size); // modules à taille entière : bords nets
  }
  function qrPngBlob(qr, done) {
    const n = qr.getModuleCount();
    const scale = pngScale(qr);
    const px = (n + QUIET * 2) * scale;
    const canvas = document.createElement('canvas');
    canvas.width = px; canvas.height = px;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = '#000000';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (qr.isDark(r, c)) ctx.fillRect((c + QUIET) * scale, (r + QUIET) * scale, scale, scale);
    }
    canvas.toBlob(done, 'image/png');
  }
  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const el = {
    phone: $('phone'), phoneTag: $('phoneTag'), phoneNote: $('phoneNote'),
    message: $('message'), meter: $('meter'), countText: $('countText'), segText: $('segText'), smsAlerts: $('smsAlerts'),
    linkOut: $('linkOut'), copyBtn: $('copyBtn'),
    device: $('device'), pvNumber: $('pvNumber'), pvText: $('pvText'), openBtn: $('openBtn'),
    formatHelp: $('formatHelp'), qrAlerts: $('qrAlerts'),
    qrFrame: $('qrFrame'), qr: $('qr'), qrMeta: $('qrMeta'), qrEmpty: $('qrEmpty'),
    pngBtn: $('pngBtn'), svgBtn: $('svgBtn'), dlNote: $('dlNote'), version: $('version')
  };
  const formatRadios = Array.from(document.querySelectorAll('input[name="qrFormat"]'));
  const langButtons = Array.from(document.querySelectorAll('[data-lang]'));

  let lang = initialLang();
  let format = store.get(FORMAT_KEY) === 'smsto' ? 'smsto' : 'sms';
  let current = { phone: null, link: '', qr: null };
  let copyTimer = null;

  function initialLang() {
    const saved = store.get(LANG_KEY);
    if (saved && I18N[saved]) return saved;
    return (navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr';
  }
  const t = () => I18N[lang];

  function node(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function chipsFor(list) {
    const wrap = node('div', 'chips');
    list.forEach((c) => wrap.appendChild(node('span', 'chip', t().charNames[c] || c)));
    return wrap;
  }

  // ---------- Rendu ----------
  function render() {
    const tr = t();
    const phone = analyzePhone(el.phone.value);
    const text = el.message.value.trim();
    const sms = analyzeSms(text);

    // Numéro
    el.phone.setAttribute('aria-invalid', phone.state === 'invalid' ? 'true' : 'false');
    el.phoneNote.classList.toggle('is-error', phone.state === 'invalid');
    el.phoneNote.textContent = phone.state === 'invalid' ? (phone.reason === 'chars' ? tr.phoneErrChars : tr.phoneErrLength) : tr.phoneHelp;
    el.phoneTag.hidden = phone.state !== 'ok';
    if (phone.state === 'ok') el.phoneTag.textContent = phone.kind === 'short' ? tr.phoneShort : tr.phoneLong;

    // Compteur : une case par SMS
    const slots = Math.max(1, sms.segments);
    const cap = sms.segments > 1 ? sms.per : sms.limit;
    el.meter.textContent = '';
    for (let i = 0; i < slots; i++) {
      const slot = node('span', 'slot' + (i > 0 ? ' is-extra' : ''));
      slot.style.setProperty('--cap', cap);
      const fill = node('span', 'fill');
      const used = Math.min(Math.max(sms.units - i * cap, 0), cap);
      fill.style.width = (used / cap * 100) + '%';
      slot.appendChild(fill);
      el.meter.appendChild(slot);
    }
    el.countText.textContent = tr.count(sms.units, sms.limit);
    el.segText.textContent = sms.segments ? tr.segs(sms.segments, sms.encoding) : '';
    el.segText.classList.toggle('is-extra', sms.segments > 1);

    el.smsAlerts.textContent = '';
    if (sms.segments > 1) {
      const a = node('div', 'alert error');
      a.appendChild(node('p', null, tr.alertMulti(sms.segments, sms.per)));
      el.smsAlerts.appendChild(a);
    }
    if (sms.nonGsm.length) {
      const fixable = toGsm(text) !== text;
      const a = node('div', 'alert warn');
      a.appendChild(node('p', null, fixable ? tr.alertUcs2 : tr.alertUcs2Left));
      a.appendChild(chipsFor(sms.nonGsm));
      if (fixable) {
        const b = node('button', null, tr.fixBtn);
        b.type = 'button';
        b.addEventListener('click', () => { el.message.value = toGsm(el.message.value); render(); el.message.focus(); });
        a.appendChild(b);
      }
      el.smsAlerts.appendChild(a);
    }
    if (sms.ext.length) {
      const a = node('div', 'alert warn');
      a.appendChild(node('p', null, tr.alertExt));
      a.appendChild(chipsFor(sms.ext));
      el.smsAlerts.appendChild(a);
    }

    // Lien
    const ok = phone.state === 'ok';
    current.phone = ok ? phone.clean : null;
    current.link = ok ? buildLink(phone.clean, text) : '';
    el.linkOut.classList.toggle('is-empty', !ok);
    el.linkOut.textContent = ok ? current.link : tr.linkEmpty;
    el.copyBtn.disabled = !ok;
    if (!copyTimer) el.copyBtn.textContent = tr.copy;

    // Aperçu
    el.pvNumber.textContent = ok ? phone.clean : tr.pvNumberEmpty;
    el.pvNumber.classList.toggle('is-empty', !ok);
    el.pvText.textContent = text || tr.pvTextEmpty;
    el.pvText.classList.toggle('is-empty', !text);
    if (ok) { el.openBtn.href = current.link; el.openBtn.removeAttribute('aria-disabled'); el.openBtn.removeAttribute('tabindex'); }
    else { el.openBtn.removeAttribute('href'); el.openBtn.setAttribute('aria-disabled', 'true'); el.openBtn.setAttribute('tabindex', '-1'); }

    // Format
    formatRadios.forEach((r) => { r.checked = r.value === format; });
    el.formatHelp.querySelectorAll('li').forEach((li) => li.classList.toggle('is-active', li.dataset.format === format));
    el.qrAlerts.textContent = '';
    if (format === 'smsto' && /[^\x00-\x7F]/.test(text)) {
      const a = node('div', 'alert warn');
      a.appendChild(node('p', null, tr.smstoAccent));
      el.qrAlerts.appendChild(a);
    }

    // QR
    current.qr = null;
    let qrMessage = tr.qrEmpty;
    if (ok) {
      try {
        current.qr = makeQr(buildQrContent(format, phone.clean, text, current.link));
      } catch (e) {
        qrMessage = tr.qrError;
      }
    }
    el.qrFrame.hidden = !current.qr;
    el.qrEmpty.hidden = !!current.qr;
    el.qrEmpty.textContent = qrMessage;
    el.pngBtn.disabled = el.svgBtn.disabled = !current.qr;
    if (current.qr) {
      const n = current.qr.getModuleCount();
      el.qr.innerHTML = qrSvg(current.qr);
      el.qr.setAttribute('aria-label', tr.qrAlt);
      el.qrMeta.textContent = tr.qrModules(n) + (n >= 57 ? '. ' + tr.qrDense : '');
      const px = (n + QUIET * 2) * pngScale(current.qr);
      el.dlNote.textContent = tr.dlNote(px);
      el.dlNote.hidden = false;
    } else {
      el.qr.textContent = '';
      el.dlNote.hidden = true;
    }
  }

  function applyLang() {
    const tr = t();
    document.documentElement.lang = lang;
    document.title = tr.docTitle;
    document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = tr[n.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-aria]').forEach((n) => { n.setAttribute('aria-label', tr[n.dataset.i18nAria]); });
    el.phone.placeholder = tr.phonePh;
    el.message.placeholder = tr.messagePh;
    el.device.setAttribute('aria-label', tr.deviceLabel);
    langButtons.forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
    const date = new Date(APP_UPDATED + 'T00:00:00Z').toLocaleDateString(tr.locale, { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    el.version.textContent = tr.version(APP_VERSION, date);
    render();
  }

  // ---------- Actions ----------
  el.phone.addEventListener('input', render);
  el.message.addEventListener('input', render);
  formatRadios.forEach((r) => r.addEventListener('change', () => {
    if (!r.checked) return;
    format = r.value === 'smsto' ? 'smsto' : 'sms';
    store.set(FORMAT_KEY, format);
    render();
  }));
  langButtons.forEach((b) => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    store.set(LANG_KEY, lang);
    applyLang();
  }));

  function flashCopy(label) {
    el.copyBtn.textContent = label;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { copyTimer = null; el.copyBtn.textContent = t().copy; }, 1800);
  }
  el.copyBtn.addEventListener('click', () => {
    if (!current.link) return;
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = current.link; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let done = false;
      try { done = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      flashCopy(done ? t().copied : t().copyFail);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(current.link).then(() => flashCopy(t().copied), fallback);
    } else { fallback(); }
  });

  function fileBase() { return 'qr-' + format + '-' + (current.phone || 'sms').replace('+', ''); }
  el.pngBtn.addEventListener('click', () => {
    if (!current.qr) return;
    qrPngBlob(current.qr, (blob) => { if (blob) download(blob, fileBase() + '.png'); });
  });
  el.svgBtn.addEventListener('click', () => {
    if (!current.qr) return;
